<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/accounts" aria-label="Harbor home">
      <span class="brand-mark">H</span>
      <span>
        <strong>Harbor</strong>
        <small>Personal banking lab</small>
      </span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a routerLink="/accounts" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accounts</a>
      <a routerLink="/counter" routerLinkActive="active">Counter</a>

  <main class="page-content">

  <footer class="footer">

    <span>Securely learning one component at a time</span>
