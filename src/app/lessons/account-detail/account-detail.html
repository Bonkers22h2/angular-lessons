<h2>Account Details:</h2>

<div *ngIf="account">
    <p>Id: {{account.id}}</p>
    <p>Owner: {{account.ownerName}}</p>
    <p>Account Number: {{account.accountNumber}}</p>
    <p>Type: {{account.accountType}}</p>
    <p>Balance: ₱{{account.balance}}</p>
    <p>Status: {{ account.active ? 'Active' : 'Closed' }}</p>
    <p>Created: {{ account.createdAt}}</p>


    <h3>Withdraw</h3>
    <form (ngSubmit)="withdraw()">
        <input type="number" [(ngModel)]="withdrawAmount" name="amount" placeholder="Amount" required>
        <button type="submit">Withdraw</button>
    </form>

    <h3>Deposit</h3>
    <form (ngSubmit)="deposit()">
        <input type="number" [(ngModel)]="depositAmount" name="amount" placeholder="Amount" required>
        <button type="submit">Deposit</button>
    </form>

    <button *ngIf="account.active" type="button" (click)="closeAccount()">
        Close Account
    </button>

    <button *ngIf="!account.active" type="button" (click)="activateAccount()">
        Activate Account
    </button>
</div>
