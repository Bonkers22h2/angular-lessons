<p>saving-goal-detail works!</p>

<ng-container *ngIf="savingGoal as goal; else loading">
    <h1>{{goal.goalName}}</h1>
    <h2>{{goal.id}}</h2>
    <h2>{{goal.accountNumber}}</h2>

    <p>{{goal.targetAmount}}</p>
    <p>{{goal.currentAmount}}</p>

    <form (ngSubmit)="contribute()">
        <input type="number" name="contributeAmount" [(ngModel)]="contributeAmount" placeholder="Contribute Amount" required>
        <button type="submit">Contribute</button>
    </form>
</ng-container>

<ng-template #loading>
    <p>Loading saving goal...</p>
</ng-template>
